name: Build and Publish Kalo

on:
  push:
    branches: [ main ]
    paths:
      - 'kalo/**'
      - 'backend/**'
      - 'README.md'
      - 'NOTICE.md'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalo-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kalo
        uses: actions/checkout@v5

      - name: Checkout pinned Cinny 4.12.7
        uses: actions/checkout@v5
        with:
          repository: cinnyapp/cinny
          ref: 8967c13878137841e49ee17184b689a6b4da334a
          path: vendor/cinny

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: vendor/cinny/package-lock.json

      - name: Apply Kalo patches
        run: |
          node kalo/patch-build.mjs vendor/cinny kalo
          node kalo/complete-build.mjs vendor/cinny
          node kalo/vietnamese-ui.mjs vendor/cinny

      - name: Install dependencies
        working-directory: vendor/cinny
        run: npm ci

      - name: Upstream typecheck diagnostic
        continue-on-error: true
        working-directory: vendor/cinny
        run: npm run typecheck

      - name: Build production app
        working-directory: vendor/cinny
        run: npm run build

      - name: Smoke test built files
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/cinny/dist/index.html
          test -s vendor/cinny/dist/config.json
          test -s vendor/cinny/dist/manifest.json
          test -s vendor/cinny/dist/kalo/kalo.svg
          test -s vendor/cinny/dist/kalo/kalo-theme.css
          test -s vendor/cinny/dist/kalo/kalo-overlay.js
          grep -q 'Kalo' vendor/cinny/dist/index.html
          grep -q './manifest.json' vendor/cinny/dist/index.html
          grep -q './assets/' vendor/cinny/dist/index.html
          grep -q 'matrix.org' vendor/cinny/dist/config.json
          grep -q 'kalo-privacy' vendor/cinny/dist/kalo/kalo-theme.css
          echo "Kalo production build smoke test passed."

      - name: Publish verified build to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd vendor/cinny/dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "Deploy Kalo ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
