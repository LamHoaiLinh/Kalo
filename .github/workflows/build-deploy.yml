name: Test and Publish Kalo Native

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'README.md'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalo-native-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kalo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.13.1'

      - name: Syntax checks
        run: |
          node --check web/config.js
          node --check web/crypto.js
          node --check web/webrtc.js
          node --check web/app.js
          node --check web/sw.js

      - name: Static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/crypto.js
          test -s web/webrtc.js
          grep -q 'Kalo' web/index.html
          grep -q 'Tạo tài khoản' web/index.html
          grep -q 'Quên mật khẩu' web/index.html
          grep -q 'kalo-auth' web/config.js
          grep -q 'kalo_messages' web/app.js
          grep -q 'RTCPeerConnection' web/webrtc.js
          if grep -RniE 'matrix\.org|Homeserver|Continue with SSO|Powered by Matrix' web; then
            echo "Matrix-facing text must not exist in native Kalo web."
            exit 1
          fi
          echo "Kalo native static checks passed."

      - name: Auth API smoke check
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS -X POST 'https://qjpcxhackvoewcxlatis.supabase.co/functions/v1/kalo-auth' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_TArSkv7lbokFpK9KZxp5Iw_iJ7f29wh' \
            --data '{"action":"login","identifier":"__kalo_smoke__","password":"invalid-password"}')"
          echo "$body" | grep -q 'ID hoặc mật khẩu không đúng'
          echo "Kalo auth endpoint smoke check passed."

      - name: Publish verified site to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp -a web /tmp/kalo-site
          cd /tmp/kalo-site
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "Deploy Kalo Native ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
